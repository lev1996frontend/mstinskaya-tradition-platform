version: "3.9"

services:
  backend:
    build:
      context: .
    container_name: mstina-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://mstina:${POSTGRES_PASSWORD}@postgres:5432/mstina
    depends_on:
      - postgres
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: mstina-postgres
    environment:
      POSTGRES_DB: mstina
      POSTGRES_USER: mstina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
